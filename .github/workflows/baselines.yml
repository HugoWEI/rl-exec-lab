name: baselines

# Runs only the baseline policies (no training) on Binance data and saves the table to
# results/baselines.txt. Start it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      symbol: {description: "Binance spot symbol", default: "BTCUSDT"}
      start: {description: "First month (YYYY-MM)", default: "2023-01"}
      end: {description: "Last month (YYYY-MM)", default: "2024-12"}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas pyyaml pytest
      - run: python -m pytest -q tests
      - name: Run baselines (validation split)
        run: |
          mkdir -p results
          python scripts/run_baselines.py --symbol "${{ inputs.symbol }}" --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" | tee results/baselines.txt
      - name: Publish results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/baselines.txt
          git commit -m "Update baseline results" || echo "no changes"
          git pull --rebase origin main
          git push
