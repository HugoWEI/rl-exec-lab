name: train

# Downloads Binance 1-minute bars, trains the RL agents on CPU, compares them with the baselines
# on the validation split and publishes the results to the viewer (docs/data/demo.json).
on:
  workflow_dispatch:
    inputs:
      symbol: {description: "Binance spot symbol", default: "BTCUSDT"}
      start: {description: "First month (YYYY-MM)", default: "2023-01"}
      end: {description: "Last month (YYYY-MM)", default: "2024-12"}
      methods: {description: "RL methods, comma-separated", default: "dqn,ddqn,dueling_ddqn,ppo"}
      seeds: {description: "Agents trained per method", default: "3"}
      features: {description: "State features: comma-separated list, or 'all'", default: "all"}
  push:
    branches: [main]
    paths: [".github/workflows/train.yml"]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SYMBOL: ${{ inputs.symbol || 'BTCUSDT' }}
      START: ${{ inputs.start || '2023-01' }}
      END: ${{ inputs.end || '2024-12' }}
      METHODS: ${{ inputs.methods || 'dqn,ddqn,dueling_ddqn,ppo' }}
      SEEDS: ${{ inputs.seeds || '3' }}
      FEATURES: ${{ inputs.features || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas pyyaml pytest
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests
      - name: Train and evaluate (validation split)
        run: |
          mkdir -p results
          python -u scripts/train.py --symbol "$SYMBOL" --start "$START" --end "$END" \
            --methods "$METHODS" --seeds "$SEEDS" --features "$FEATURES" \
            --export docs/data/demo.json | tee results/train.txt
      - name: Publish results
        run: |
          python scripts/export_schema.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/demo.json docs/data/schema.json results/train.txt
          git commit -m "Update results (${SYMBOL} ${START} to ${END}: ${METHODS}, ${SEEDS} seeds)" || echo "no changes"
          git pull --rebase origin main
          git push
