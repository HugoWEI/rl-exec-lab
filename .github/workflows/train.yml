name: train

# Downloads Binance 1-minute bars, trains DDQN agents on CPU, compares them with the baselines
# on the validation split and publishes the results to the viewer (docs/data/demo.json).
on:
  workflow_dispatch:
    inputs:
      symbol: {description: "Binance spot symbol", default: "BTCUSDT"}
      start: {description: "First month (YYYY-MM)", default: "2023-01"}
      end: {description: "Last month (YYYY-MM)", default: "2024-12"}
      seeds: {description: "Number of agents to train", default: "5"}
      features: {description: "State features: comma-separated list, or 'all'", default: "all"}
  push:
    branches: [main]
    paths: [".github/workflows/train.yml"]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SYMBOL: ${{ inputs.symbol || 'BTCUSDT' }}
      START: ${{ inputs.start || '2023-01' }}
      END: ${{ inputs.end || '2024-12' }}
      SEEDS: ${{ inputs.seeds || '5' }}
      FEATURES: ${{ inputs.features || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas pyyaml pytest
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests
      - run: python scripts/download_binance.py --symbol "$SYMBOL" --start "$START" --end "$END"
      - name: Train and evaluate (validation split)
        run: |
          mkdir -p results
          python -u scripts/train_ddqn.py --data "data/${SYMBOL}-1m-*.zip" --seeds "$SEEDS" --features "$FEATURES" \
            --export docs/data/demo.json \
            --label "${SYMBOL} spot, 1-minute bars from Binance, ${START} to ${END}" | tee results/ddqn.txt
      - name: Publish results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/demo.json results/ddqn.txt
          git commit -m "Update DDQN results (${SYMBOL} ${START} to ${END}, ${SEEDS} seeds)" || echo "no changes"
          git pull --rebase origin main
          git push
