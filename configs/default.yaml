data:
  source: binance              # binance or synthetic
  symbol: BTCUSDT
  start: "2023-01"             # first month
  end: "2024-12"               # last month
  dir: data                    # where downloaded files are kept
  synthetic_days: 120          # synthetic only
  midday_dip_bps: 0            # synthetic only: plant a learnable average midday dip

methods: [dqn, ddqn, dueling_ddqn, ppo]   # RL agents to train
seeds: 3                                  # independently trained agents per method

market:
  step_minutes: 5        # decision interval; 288 steps per day
  window: 60             # steps used for rolling sigma, volume and range
  features: [ret_1, ret_12, vol, rel_volume, price_vs_arrival]

parent:
  mode: pct_prev_day_volume   # or fixed_qty
  value: 0.01                 # buy 1% of the previous day's volume

action:
  mode: twap_multiple          # buy m x (remaining / steps left); m = 1 is TWAP. Or fraction_of_remaining
  grid: [0.0, 0.5, 1.0, 2.0, 4.0]

costs:
  fees:              {enabled: true,  bps: 1.0}
  spread:            {enabled: true,  mode: fixed, half_spread_bps: 0.5, range_coef: 0.25}
  temp_impact:       {enabled: true,  eta: 1.0, delta: 0.5}
  perm_impact:       {enabled: false, gamma: 0.05}
  participation_cap: {enabled: true,  max_pct: 0.10}

split:
  train: 0.6
  val: 0.2
  embargo_days: 1

dqn:                           # shared by dqn, ddqn and dueling_ddqn
  hidden: [64, 64]
  lr: 0.0003
  gamma: 1.0
  batch_size: 256
  buffer_size: 200000
  epochs: 12
  parallel_envs: 16
  eps_start: 1.0
  eps_end: 0.05
  eps_decay_frac: 0.6          # share of training over which exploration decays
  tau: 0.005                   # soft target-network update
  warmup_steps: 5000
  reward_scale: 0.1

ppo:
  hidden: [64, 64]
  lr: 0.0003
  gamma: 1.0
  gae_lambda: 0.95
  clip: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  update_epochs: 4
  minibatch: 512
  epochs: 12
  parallel_envs: 16
  reward_scale: 0.1
