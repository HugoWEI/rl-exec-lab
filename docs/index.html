<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RL Execution Lab</title>
<style>
:root {
  color-scheme: light;
  --page: #f5f5f3; --surface-1: #fcfcfb; --surface-2: #f1f0ed; --border: #e3e2de; --grid: #e9e8e4;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7b7a75; --neutral: #8a8984;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --series-5: #e87ba4; --series-6: #008300; --series-7: #6250d6; --series-8: #e34948;
  --on-bg: #e4f3ec; --on-fg: #0d6b49; --off-bg: #ecebe7; --off-fg: #6b6a65; --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #111110; --surface-1: #1a1a19; --surface-2: #232321; --border: #33322f; --grid: #2a2a28;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86; --neutral: #7d7c75;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
    --on-bg: #17332a; --on-fg: #7fd4b0; --off-bg: #2a2a28; --off-fg: #9a9991; --accent: #3987e5;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text-primary);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1040px; margin: 0 auto; padding: 28px 20px 60px; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; margin-bottom: 14px; }
h1 { font-size: 24px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 16px; margin: 0 0 2px; }
.sub { color: var(--text-secondary); margin: 2px 0 0; }
.hint { color: var(--text-muted); font-size: 13px; margin: 0 0 12px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; }
.note { border-left: 3px solid var(--series-4); padding: 8px 12px; background: var(--surface-1); border-radius: 4px; margin-bottom: 16px; color: var(--text-secondary); }
.btn { font: inherit; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); cursor: pointer; }
.btn:hover { border-color: var(--text-muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.small { padding: 3px 9px; font-size: 13px; }
nav { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
nav button { font: inherit; background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; color: var(--text-secondary); cursor: pointer; margin-bottom: -1px; }
nav button[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--accent); font-weight: 600; }
select, input[type=text], input[type=number], input[type=month] { font: inherit; padding: 5px 8px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); }
input[type=number] { width: 92px; } input[type=text] { width: 150px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 24px; margin-top: 10px; }
.kv .k { color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.kv .v { font-variant-numeric: tabular-nums; }
ul.costs { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; }
ul.costs li { display: flex; gap: 10px; align-items: baseline; }
.chip { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; flex: none; }
.chip.on { background: var(--on-bg); color: var(--on-fg); } .chip.off { background: var(--off-bg); color: var(--off-fg); }
li.off .txt { color: var(--text-muted); }
code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
details { margin-top: 10px; color: var(--text-secondary); }
pre { white-space: pre-wrap; font: 12px/1.5 ui-monospace, Menlo, monospace; margin: 0; }
pre.box { background: var(--surface-2); border-radius: 8px; padding: 12px 14px; overflow-x: auto; white-space: pre; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
th:first-child, td:first-child { text-align: left; }
tr:last-child td { border-bottom: 0; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; }
.tag { font-size: 11px; color: var(--text-muted); border: 1px solid var(--border); border-radius: 99px; padding: 0 6px; margin-left: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--text-secondary); margin: 6px 0 4px; }
.legend button { font: inherit; background: none; border: 1px solid transparent; border-radius: 99px; padding: 1px 8px 1px 6px; color: var(--text-secondary); cursor: pointer; }
.legend button[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
.legend button:hover { border-color: var(--border); }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--text-secondary); font-size: 12px; font-family: inherit; }
svg text.strong { fill: var(--text-primary); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
#tip { position: fixed; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 16px rgba(0,0,0,.14); display: none; z-index: 10; min-width: 120px; font-variant-numeric: tabular-nums; }
#tip .t { color: var(--text-muted); margin-bottom: 3px; } #tip .r { display: flex; justify-content: space-between; gap: 16px; }
footer { color: var(--text-muted); font-size: 13px; margin-top: 20px; }
.fields { display: flex; flex-wrap: wrap; gap: 12px 22px; margin-top: 10px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--text-secondary); }
.checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 6px 20px; margin-top: 10px; }
.check { display: flex; gap: 8px; align-items: baseline; }
.check small { color: var(--text-muted); display: block; }
.costrow { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: flex-end; padding: 10px 0; border-bottom: 1px solid var(--border); }
.costrow:last-of-type { border-bottom: 0; }
.costrow .name { width: 190px; } .costrow .name small { display: block; color: var(--text-muted); }
.costrow.off .field { opacity: .45; }
.steps { margin: 10px 0 0; padding-left: 20px; } .steps li { margin-bottom: 8px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>RL Execution Lab</h1>
      <p class="sub" id="subtitle">Loading results…</p>
    </div>
    <div>
      <input type="file" id="file" accept=".json,application/json" hidden>
      <button class="btn" id="load">Open a results file…</button>
    </div>
  </header>
  <nav role="tablist">
    <button role="tab" id="tab-results" aria-selected="true">Results</button>
    <button role="tab" id="tab-new" aria-selected="false">New run</button>
  </nav>
  <div id="results"></div>
  <div id="builder" hidden></div>
  <footer>Task: buy a fixed quantity within one day. Shortfall is the all-in average price paid relative to the day's first price, in basis points; lower is better. Source and instructions: <a href="https://github.com/HugoWEI/rl-exec-lab" style="color:inherit">github.com/HugoWEI/rl-exec-lab</a>.</footer>
</main>
<div id="tip"></div>
<script>
// ---------- shared helpers ------------------------------------------------------------------
const FALLBACK_LABELS = { twap: "TWAP", buy_at_start: "Buy at start", buy_at_end: "Buy at end", random: "Random",
  perfect_foresight: "Perfect foresight", dqn: "DQN", ddqn: "Double DQN", dueling_ddqn: "Dueling Double DQN", ppo: "PPO" };
// Colour follows the policy, never its rank. Simple reference baselines are grey (told apart by label and dash).
const SLOT = { twap: 1, perfect_foresight: 2, dqn: 3, ddqn: 4, dueling_ddqn: 5, ppo: 7 };
const DASH = { buy_at_start: "7 4", buy_at_end: "2 4", random: "1 5" };
const COMPONENTS = [["fees", "Fees"], ["spread", "Spread"], ["temp_impact", "Temp. impact"], ["perm_impact", "Perm. impact"]];
const NS = "http://www.w3.org/2000/svg";
let LABELS = { ...FALLBACK_LABELS }, SCHEMA = null;
const label = p => LABELS[p] || p;
const color = p => (SLOT[p] ? `var(--series-${SLOT[p]})` : "var(--neutral)");
const f1 = x => (x == null ? "–" : (Math.abs(x) < 0.005 ? 0 : x).toFixed(Math.abs(x) >= 100 ? 0 : Math.abs(x) >= 10 ? 1 : 2));
const sgn = x => (x > 0.005 ? "+" : "") + f1(x);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = id => document.getElementById(id);
function svgEl(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) k === "text" ? (e.textContent = attrs[k]) : e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const tip = $("tip");
function showTip(evt, html) {
  tip.innerHTML = html; tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(evt.clientX + 14, innerWidth - w - 8) + "px";
  tip.style.top = Math.max(8, evt.clientY - h - 12) + "px";
}
const hideTip = () => (tip.style.display = "none");
function ticks(lo, hi, n = 6) {
  const step0 = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 5, 10].map(m => m * mag).find(s => s >= step0);
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
const sw = p => `<span class="sw" style="background:${color(p)}"></span>`;

// ---------- results view ----------------------------------------------------------------------
function render(data) {
  LABELS = { ...FALLBACK_LABELS };
  for (const p of data.policies || []) if (p.label) LABELS[p.name] = p.label;
  const app = $("results"), m = data.meta, cfg = data.config, c = cfg.costs;
  const kind = Object.fromEntries((data.policies || []).map(p => [p.name, p]));
  $("subtitle").textContent = `${m.label} · ${m.split === "val" ? "validation" : m.split} split · ${m.n_days} days (${m.first_day} to ${m.last_day})`;
  const rows = data.summary;
  const tcomps = COMPONENTS.filter(([k]) => c[k].enabled || rows.some(r => r[k] > 0));
  const anyCost = COMPONENTS.some(([k]) => c[k].enabled);
  const costLines = [
    [c.fees.enabled, `<b>Fees</b>: ${c.fees.bps} bps of notional`],
    [c.spread.enabled, `<b>Spread</b>: ` + (c.spread.mode === "fixed" ? `fixed half-spread of ${c.spread.half_spread_bps} bps`
      : `half-spread = ${c.spread.range_coef} × rolling mean (high − low) / close`)],
    [c.temp_impact.enabled, `<b>Temporary impact</b>: <code>η · σ · (q / V)<sup>δ</sup></code> with η = ${c.temp_impact.eta}, δ = ${c.temp_impact.delta} (η is an assumption, not calibrated)`],
    [c.perm_impact.enabled, `<b>Permanent impact</b>: later prices shift by <code>γ · bought / previous-day volume</code>, γ = ${c.perm_impact.gamma}`],
    [c.participation_cap.enabled, `<b>Participation cap</b>: each order ≤ ${(100 * c.participation_cap.max_pct).toFixed(0)}% of V; waived on the last step`],
  ];
  const parent = cfg.parent.mode === "pct_prev_day_volume"
    ? `${+(100 * cfg.parent.value).toFixed(3)}% of previous day's volume` : `${cfg.parent.value} units`;
  const sizes = m.split_sizes ? Object.entries(m.split_sizes).map(([k, v]) => `${k} ${v}`).join(" · ") : "–";
  const tr = data.training;

  app.innerHTML = `
    ${m.note ? `<div class="note">${esc(m.note)}</div>` : ""}
    ${anyCost ? "" : `<div class="note">All costs are off: this run measures pure price timing, not execution quality.</div>`}
    <section class="card">
      <div class="row"><h2>Setup</h2><button class="btn small" id="edit">Edit these settings in a new run</button></div>
      <div class="grid">
        <div class="kv"><div class="k">Order size</div><div class="v">${parent}</div></div>
        <div class="kv"><div class="k">Decision step</div><div class="v">${cfg.market.step_minutes} min (${1440 / cfg.market.step_minutes} per day)</div></div>
        <div class="kv"><div class="k">Days per split</div><div class="v">${sizes}</div></div>
        ${cfg.action ? `<div class="kv"><div class="k">Agent actions</div><div class="v">${cfg.action.mode === "twap_multiple" ? "× TWAP rate: " : "share of remaining: "}${cfg.action.grid.join(", ")}</div></div>` : ""}
      </div>
      <div class="kv" style="margin-top:10px"><div class="k">State features</div><div class="v">${cfg.market.features.join(", ") || "none"} (plus time and inventory remaining)</div></div>
      <ul class="costs">${costLines.map(([on, t]) => `<li class="${on ? "on" : "off"}"><span class="chip ${on ? "on" : "off"}">${on ? "ON" : "OFF"}</span><span class="txt">${t}</span></li>`).join("")}</ul>
      <details><summary>Full cost model text</summary><pre>${esc(data.cost_description)}</pre></details>
    </section>
    <section class="card">
      <h2>Results</h2>
      <p class="hint">Mean over ${m.n_days} days, in bps. "vs TWAP" below zero means cheaper than TWAP; the interval is a 95% paired bootstrap over days.${tr ? " Each RL row is the average over its seeds." : ""}</p>
      <div class="tablewrap"><table>
        <thead><tr><th>Policy</th><th>Shortfall</th><th>vs TWAP</th><th>95% CI</th><th>Timing</th>${tcomps.map(([, n]) => `<th>${n}</th>`).join("")}<th>Forced</th></tr></thead>
        <tbody>${rows.map(r => { const k = kind[r.policy] || {}; return `<tr><td>${sw(r.policy)}${esc(label(r.policy))}${k.uses_future ? '<span class="tag">hindsight</span>' : ""}${k.kind === "rl" ? '<span class="tag">RL</span>' : ""}</td>
          <td>${f1(r.shortfall_bps)}</td><td>${r.policy === "twap" ? "–" : sgn(r.vs_twap)}</td><td>${r.policy === "twap" ? "–" : `${sgn(r.ci_low)} to ${sgn(r.ci_high)}`}</td>
          <td>${f1(r.timing)}</td>${tcomps.map(([c2]) => `<td>${f1(r[c2])}</td>`).join("")}<td>${(100 * r.forced_pct).toFixed(1)}%</td></tr>`; }).join("")}</tbody>
      </table></div>
    </section>
    <section class="card">
      <h2>Difference vs TWAP</h2>
      <p class="hint">Dot = mean difference in bps, bar = 95% interval. An interval that crosses zero is not distinguishable from TWAP.</p>
      <div id="c-diff"></div>
    </section>
    ${tr ? `<section class="card">
      <h2>RL agents, seed by seed</h2>
      <p class="hint">Each filled dot is one independently trained agent: its mean difference vs TWAP in bps on this split. The open ring is the method's average at the final training epoch on validation, which involves no picking of the best epoch. A wide spread, or a ring far from the dots, means the result is fragile.</p>
      <div id="c-seeds"></div>
    </section>
    ${tr.runs.some(r => r.train_vs_twap != null) ? `<section class="card">
      <h2>Overfitting check</h2>
      <p class="hint">The same trained agents scored on the days they were trained on (open diamond) and on this split's days (filled dot), as mean difference vs TWAP in bps, averaged over seeds. If the diamond sits far to the left of the dot, the agents memorised their training days instead of learning something that carries over.</p>
      <div id="c-overfit"></div>
    </section>` : ""}
    <section class="card">
      <h2>Learning curves</h2>
      <p class="hint">Difference vs TWAP (bps) after each training epoch, averaged over seeds: solid lines on validation days, dashed lines on a sample of training days. Below zero is better than TWAP; dashed lines falling while solid lines stay flat is overfitting.</p>
      <div class="legend" id="l-curves"></div><div id="c-curves"></div>
    </section>` : ""}
    <section class="card">
      <h2>Trading costs paid</h2>
      <p class="hint">Mean cost per policy in bps, excluding price timing.</p>
      <div class="legend" id="l-cost"></div><div id="c-cost"></div>
    </section>
    <section class="card">
      <div class="row"><h2>Schedules on one day</h2><label>Day <select id="day"></select></label></div>
      <p class="hint">Top: price during the day. Bottom: share of the order bought so far. Click a name to show or hide it.${tr ? " RL lines show each method's median seed." : ""}</p>
      <div class="legend" id="l-sched"></div><div id="c-price"></div><div id="c-sched"></div>
    </section>`;

  $("edit").onclick = () => { if (!SCHEMA) return; fillForm(mergeCfg(SCHEMA.defaults, cfg)); showTab("new"); };
  drawDiff(rows.filter(r => r.policy !== "twap"));
  if (tr) { drawSeeds(tr); drawCurves(tr); if (tr.runs.some(r => r.train_vs_twap != null)) drawOverfit(tr); }
  drawCosts(rows, c);
  const names = data.policies.map(p => p.name), rl = names.filter(n => (kind[n] || {}).kind === "rl");
  const visible = new Set(rl.length ? ["twap", "perfect_foresight", ...rl] : names);
  const sel = $("day");
  sel.innerHTML = data.samples.map((s, i) => `<option value="${i}">${s.date}</option>`).join("");
  const redraw = () => drawSchedule(data, +sel.value, visible, redraw);
  sel.onchange = redraw;
  redraw();
}

function rowChart(host, rows, aria, lo0, hi0, draw, rowH = 34) {
  const W = 960, L = 170, R = 70, H = rows.length * rowH + 34;
  const pad = (hi0 - lo0) * 0.05 || 1, lo = lo0 < 0 ? lo0 - pad : lo0, hi = hi0 + pad;
  const x = v => L + (v - lo) / (hi - lo) * (W - L - R);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": aria });
  for (const t of ticks(lo, hi, 7)) {
    svgEl("line", { x1: x(t), x2: x(t), y1: 4, y2: H - 26, stroke: t === 0 && lo < 0 ? "var(--text-muted)" : "var(--grid)" }, svg);
    svgEl("text", { x: x(t), y: H - 8, "text-anchor": "middle", text: t }, svg);
  }
  rows.forEach((r, i) => {
    const y = 4 + i * rowH + rowH / 2;
    svgEl("text", { x: L - 12, y: y + 4, "text-anchor": "end", class: "strong", text: label(r.policy || r.name) }, svg);
    draw(svg, r, x, y, W, rowH);
  });
  $(host).replaceChildren(svg);
}

function drawDiff(rows) {
  rowChart("c-diff", rows, "Difference versus TWAP by policy", Math.min(0, ...rows.map(r => r.ci_low)), Math.max(0, ...rows.map(r => r.ci_high)),
    (svg, r, x, y, W, rowH) => {
      svgEl("line", { x1: x(r.ci_low), x2: x(r.ci_high), y1: y, y2: y, stroke: color(r.policy), "stroke-width": 2, "stroke-linecap": "round", opacity: .55 }, svg);
      svgEl("circle", { cx: x(r.vs_twap), cy: y, r: 5, fill: color(r.policy), stroke: "var(--surface-1)", "stroke-width": 2 }, svg);
      svgEl("text", { x: x(r.ci_high) + 10, y: y + 4, text: sgn(r.vs_twap) }, svg);
      const hit = svgEl("rect", { x: 0, y: y - rowH / 2, width: W, height: rowH, fill: "transparent" }, svg);
      hit.onmousemove = e => showTip(e, `<div class="t">${esc(label(r.policy))} vs TWAP</div><div class="r"><span>Mean</span><b>${sgn(r.vs_twap)} bps</b></div><div class="r"><span>95% CI</span><span>${sgn(r.ci_low)} to ${sgn(r.ci_high)}</span></div>`);
      hit.onmouseleave = hideTip;
    });
}

const methodsOf = tr => tr.methods || [...new Set(tr.runs.map(r => r.method || "dueling_ddqn"))].map(name => ({ name }));
const runsOf = (tr, m) => tr.runs.filter(r => (r.method || "dueling_ddqn") === m);
const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
const finalOf = r => r.final_val_vs_twap ?? r.epochs[r.epochs.length - 1].val_vs_twap;

function drawSeeds(tr) {
  const key = tr.split + "_vs_twap", ms = methodsOf(tr);
  const finals = Object.fromEntries(ms.map(m => [m.name, mean(runsOf(tr, m.name).map(finalOf))]));
  const all = [...tr.runs.map(r => r[key]), ...Object.values(finals)];
  rowChart("c-seeds", ms, "Difference versus TWAP for each trained agent", Math.min(0, ...all), Math.max(0, ...all), (svg, m, x, y) => {
    const ring = svgEl("circle", { cx: x(finals[m.name]), cy: y, r: 7, fill: "var(--surface-1)", stroke: color(m.name), "stroke-width": 2 }, svg);
    ring.onmousemove = e => showTip(e, `<div class="t">${esc(label(m.name))}</div><div class="r"><span>Final epoch, validation, mean of seeds</span><b>${sgn(finals[m.name])} bps</b></div>`);
    ring.onmouseleave = hideTip;
    for (const r of runsOf(tr, m.name)) {
      const dot = svgEl("circle", { cx: x(r[key]), cy: y, r: 5, fill: color(m.name), stroke: "var(--surface-1)", "stroke-width": 2 }, svg);
      dot.onmousemove = e => showTip(e, `<div class="t">${esc(label(m.name))}, seed ${r.seed}</div><div class="r"><span>vs TWAP</span><b>${sgn(r[key])} bps</b></div><div class="r"><span>Best epoch (validation)</span><span>${r.best_epoch} of ${r.epochs.length}</span></div><div class="r"><span>Final epoch (validation)</span><span>${sgn(finalOf(r))} bps</span></div>`);
      dot.onmouseleave = hideTip;
    }
  });
}

function drawOverfit(tr) {

function drawCurves(tr) {

  $("l-curves").innerHTML = ms.map(m => `<span>${sw(m.name)}${esc(label(m.name))}</span>`).join("") + (hasTrain ? `<span>solid = validation · dashed = training sample</span>` : "");
  const W = 960, L = 56, R = 16, H = 250, B = 30, all = curves.flatMap(c => [...c.ys, ...(c.ts || [])]);

  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Validation difference versus TWAP by training epoch" });
  for (const t of ticks(lo, hi, 5)) {

  }
  for (let i = 0; i < E; i++) svgEl("text", { x: x(i), y: H - 10, "text-anchor": "middle", text: (i ? "" : "epoch ") + (i + 1) }, svg);
  for (const c of curves) {
    svgEl("path", { d: c.ys.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(""), fill: "none", stroke: color(c.name), "stroke-width": 2, "stroke-linejoin": "round" }, svg);

  const hit = svgEl("rect", { x: L - 10, y: 0, width: W - L - R + 20, height: H - B, fill: "transparent" }, svg);
  hit.onmousemove = e => {
    const box = svg.getBoundingClientRect(), px = (e.clientX - box.left) / box.width * W;
    const i = E > 1 ? Math.max(0, Math.min(E - 1, Math.round((px - L) / (W - L - R) * (E - 1)))) : 0;
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");

  };
  hit.onmouseleave = () => { hideTip(); cross.setAttribute("visibility", "hidden"); };

function drawCosts(rows, c) {

function drawSchedule(data, idx, visible, redraw) {

  const leg = $("l-sched");

  leg.querySelectorAll("button").forEach(b => b.onclick = () => { visible.has(b.dataset.p) ? visible.delete(b.dataset.p) : visible.add(b.dataset.p); redraw(); });

    charts.push({ svg, cross });

  }

  const step = 1440 / n;
  for (const ch of charts) {
    const hit = svgEl("rect", { x: L, y: 0, width: W - L - R, height: ch.svg.viewBox.baseVal.height, fill: "transparent" }, ch.svg);
    hit.onmousemove = e => {
      const box = ch.svg.getBoundingClientRect(), px = (e.clientX - box.left) / box.width * W;
      const i = Math.max(0, Math.min(n - 1, Math.round((px - L) / (W - L - R) * (n - 1))));
      for (const c2 of charts) { c2.cross.setAttribute("x1", x(i)); c2.cross.setAttribute("x2", x(i)); c2.cross.setAttribute("visibility", "visible"); }
      const mins = i * step, hh = String(Math.floor(mins / 60)).padStart(2, "0"), mm = String(mins % 60).padStart(2, "0");

        shown.map(p => `<div class="r"><span>${sw(p)}${esc(label(p))}</span><span>${s.bought_pct[p][i].toFixed(1)}%</span></div>`).join(""));
    };

  }

  return Object.entries(v).map(([k, x]) => {
    if (Array.isArray(x)) return `${pad}${k}: [${x.map(scalar).join(", ")}]`;
    if (x && typeof x === "object") return `${pad}${k}:\n${toYaml(x, ind + 1)}`;
    return `${pad}${k}: ${scalar(x)}`;
  }).join("\n") + (ind ? "" : "\n");
}
function updateBuilder() {
  const c = readForm(), syn = c.data.source === "synthetic";
  document.querySelectorAll("#builder .bin").forEach(e => e.hidden = syn);
  document.querySelectorAll("#builder .syn").forEach(e => e.hidden = !syn);
  for (const [id, key] of [["c-fees", "fees"], ["c-spread", "spread"], ["c-temp", "temp_impact"], ["c-perm", "perm_impact"], ["c-cap", "participation_cap"]])
    document.querySelector(`.costrow[data-c="${key}"]`).classList.toggle("off", !$(id).checked);
  const fixed = $("c-spread-mode").value === "fixed";
  $("c-spread-bps").parentElement.hidden = !fixed; $("c-spread-coef").parentElement.hidden = fixed;
  const test = Math.round(100 * (1 - c.split.train - c.split.val));
  $("b-splitnote").textContent = test > 0 ? `Days are split in time order: ${Math.round(100 * c.split.train)}% train, ${Math.round(100 * c.split.val)}% validation, ${test}% test. Results use validation; the test part stays untouched unless you run with --reveal-test.`
    : "Train and validation shares must leave some days for the test split.";
  const n = c.methods.length * c.seeds;
  $("b-count").textContent = n ? `${n} agent${n > 1 ? "s" : ""} to train (${c.methods.length} method${c.methods.length > 1 ? "s" : ""} × ${c.seeds} seed${c.seeds > 1 ? "s" : ""}), ${c.dqn.epochs} epochs each. Time grows with the number of days, agents and epochs.`
    : "No method selected: use scripts/run_baselines.py to evaluate the baselines only.";
  const k = c.costs, any = k.fees.enabled || k.spread.enabled || k.temp_impact.enabled || k.perm_impact.enabled;
  const ex = (k.fees.enabled ? k.fees.bps : 0) + (k.spread.enabled && k.spread.mode === "fixed" ? k.spread.half_spread_bps : 0) + (k.temp_impact.enabled ? k.temp_impact.eta * 5 * Math.pow(0.05, k.temp_impact.delta) : 0);
  $("b-costnote").textContent = any ? `Worked example: with σ = 5 bps and an order of 5% of V, one fill costs about ${ex.toFixed(2)} bps${k.spread.enabled && k.spread.mode === "range" ? " plus the range-based spread" : ""}.`
    : "All costs are off: the run measures pure price timing. Perfect foresight will simply buy at the day's low.";
  $("b-yaml").textContent = toYaml(c);
}

// ---------- tabs, loading ---------------------------------------------------------------------
function showTab(name) {
  const isNew = name === "new";
  $("results").hidden = isNew; $("builder").hidden = !isNew;
  $("tab-results").setAttribute("aria-selected", !isNew); $("tab-new").setAttribute("aria-selected", isNew);
  history.replaceState(null, "", location.pathname + location.search + (isNew ? "#new" : ""));
  scrollTo(0, 0);
}
$("tab-results").onclick = () => showTab("results");
$("tab-new").onclick = () => showTab("new");
function fail(msg) {
  $("subtitle").textContent = "No results loaded";
  $("results").innerHTML = `<div class="note">${esc(msg)}</div>`;
}
$("load").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { render(JSON.parse(await f.text())); showTab("results"); } catch (err) { fail("Could not read that file: " + err.message); }
  e.target.value = "";
};
const src = new URLSearchParams(location.search).get("data") || "data/demo.json";
const getJson = u => fetch(u).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
getJson("data/schema.json").then(s => { SCHEMA = s; buildBuilder(); })
  .catch(() => ($("builder").innerHTML = `<div class="note">Could not load the run builder's settings (data/schema.json).</div>`))
  .finally(() => { if (location.hash === "#new") showTab("new"); });
getJson(src).then(render).catch(() => fail("Could not load " + src + ". Use “Open a results file…” to view a local results JSON."));
</script>
</body>
